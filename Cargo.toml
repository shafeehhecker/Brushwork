[package]
name = "brushwork"
version = "0.1.0"
edition = "2024"
description = "A lightweight native raster drawing and image editor"
license = "MIT"
rust-version = "1.88"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.17.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Image processing is far too slow unoptimised; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
[profile.dev]
opt-level = 1
